[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-cli"
version = "0.1.0"
description = "Autonomous multi-agent smart-contract vulnerability detection and closed-loop remediation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
llm = ["google-generativeai>=0.8.0", "openai>=1.40.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
static = ["slither-analyzer==0.11.6"]

[project.scripts]
sentinel = "sentinel.cli:app"
sentinel-api = "sentinel.api:main"
sentinel-static = "sentinel.analyzers.call_results:main"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
